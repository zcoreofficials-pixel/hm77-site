name: Auto Refresh — Update Stats & Ping Google

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update stats and sitemap
        run: |
          PLAYERS=$((38000 + RANDOM % 6000))
          WINNERS=$((1100 + RANDOM % 900))
          WIN_AMT=$((25000 + RANDOM % 50000))
          NEW_GAMES=$((7 + RANDOM % 8))
          WITHDRAWN=$((1400000 + RANDOM % 900000))
          SEGMENT=$(( $(date +%H) / 4 ))
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DATE=$(date -u +%Y-%m-%d)

          cat > refresh.config.json << JSONEOF
          {
            "lastRefreshed": "$NOW",
            "activePlayers": "$(printf "%'.f" $PLAYERS)",
            "todayWinners": "$(printf "%'.f" $WINNERS)",
            "biggestWin": "PKR $(printf "%'.f" $WIN_AMT)",
            "newGames": "$NEW_GAMES",
            "totalWithdrawn": "PKR $(echo $WITHDRAWN | sed ':a;s/\B[0-9]\{3\}\>/,&/;ta')",
            "segment": $SEGMENT
          }
          JSONEOF

          sed -i "s|<lastmod>.*</lastmod>|<lastmod>$DATE</lastmod>|g" public/sitemap.xml

          git config user.email "refresh-bot@hm-77.com"
          git config user.name "HM77 Refresh Bot"
          git add refresh.config.json public/sitemap.xml
          git diff --staged --quiet || git commit -m "Stats update $NOW — $(printf "%'.f" $PLAYERS) active players"
          git push

      - name: Ping Google Sitemap
        run: curl -s "https://www.google.com/ping?sitemap=https://hm-77.com/sitemap.xml" || true

      - name: Ping Bing Sitemap
        run: curl -s "https://www.bing.com/ping?sitemap=https://hm-77.com/sitemap.xml" || true

      - name: Warm up key pages
        run: |
          curl -s "https://hm-77.com" > /dev/null || true
          curl -s "https://hm-77.com/hm77-download" > /dev/null || true
          curl -s "https://hm-77.com/hm77-login" > /dev/null || true
          curl -s "https://hm-77.com/hm77-deposit" > /dev/null || true
          curl -s "https://hm-77.com/hm77-bonus" > /dev/null || true
